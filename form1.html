<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="get">
        <label for="dan">kullanıcı adı</label>
        
        <input type="text" required name="dan" id="dan" placeholder="kullanıcı adı giriniz"> 
        <br>
        <label for="sifre">sifre</label>
        <input type="password" name="sifre" id="sifre">
        <br>
        <label for="mail">Email Adres:</label>
        <input type="email" name="mail" id="mail" value="b@b.com" readonly>
        <br>
        <label for="a">a</label>
        <input type="text" name="aa" id="aa" value="77" disabled>
        <br>
        <label for="yas">Yaşınız</label>
        <input type="number" min="10" max="50" name="yas" id="yas">
        <br>

        <label for="cinsiyet">Cinsiyet</label>
        <input type="radio" name="cinsiyet" id="cinsiyet" value="e" >Erkek
        <input type="radio" name="cinsiyet" id="cinsiyet" value="k">Kadın
        <br>
        <label for="diller">Bildiğiniz Diller</label>
        <input type="checkbox" name="diller" id="diller" value="c"> c#
        <input type="checkbox" name="diller" id="diller" value="j"> js

        <br>
        <label for="dt">Doğum tarihi</label>
        <input type="date" name="dt" id="dt">
        <br>
        <label for="sinif">Sınıfınız</label>
        <select name="sinif" id="sinif">
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>

        </select>


        



        <br>

        <button type="submit">Gönder</button>
        <input type ="reset" value="Sıfırla">


    </form>
    
    
</body>
</html>
